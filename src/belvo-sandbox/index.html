<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectar banco | Fintrack</title>
  <link rel="stylesheet" href="/belvo-sandbox/style.css">
  <script src="/belvo-sandbox/connect.js" defer></script>
</head>
<body>
  <main>
    <h1>Conectar un banco de prueba</h1>
    <p>Inicia sesión con tu cuenta de Fintrack para probar el consentimiento en Belvo Sandbox.</p>
    <!-- Inicio de sesión con Fintrack para identificar al propietario del vínculo. -->
    <form id="login" method="post">
      <label>Correo <input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Iniciar sesión</button>
    </form>
    <!-- Acciones disponibles después del inicio de sesión. -->
    <section id="actions" hidden>
      <button id="connect">Abrir Belvo Sandbox</button>
      <button id="retry" hidden>Volver a guardar el vínculo</button>
      <button id="logout">Cerrar sesión</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <!-- Selección del vínculo, sincronización y vista previa de los datos guardados. -->
    <section id="import" hidden>
      <h2>Datos de Sandbox</h2>
      <label>Vínculo guardado <select id="links"></select></label>
      <button id="sync" type="button">Importar cuentas y movimientos</button>
      <p id="import-status" role="status" aria-live="polite"></p>
      <div id="import-data" hidden>
        <h3 id="accounts-count"></h3>
        <ul id="accounts-list"></ul>
        <h3 id="transactions-count"></h3>
        <ul id="transactions-list"></ul>
      </div>
    </section>
  </main>
</body>
</html>
